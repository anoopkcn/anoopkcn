<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The agent loop: call the model, run its tool calls, repeat">
<title>The agent loop: call the model, run its tool calls, repeat</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9bdc6"/></marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#769dce"/></marker>
  <marker id="ahY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98500"/></marker>
  <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker>
  <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker>
</defs>
<rect width="760" height="300" rx="8" fill="#22252a"/>
<g font-family="ZedSans, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b9bdc6">
<g stroke="#b9bdc6" stroke-width="1.6" fill="none" stroke-linecap="round"><circle cx="64" cy="130" r="7"/><line x1="64" y1="137" x2="64" y2="160"/><line x1="51" y1="150" x2="64" y2="143"/><line x1="64" y1="143" x2="77" y2="150"/><line x1="53" y1="180" x2="64" y2="160"/><line x1="64" y1="160" x2="75" y2="180"/></g>
<text x="64.0" y="202.0" font-size="12" fill="#7f8590" text-anchor="middle">you</text>
<rect x="200.0" y="120.0" width="200.0" height="64.0" rx="8" fill="#2c3036" stroke="#769dce" stroke-dasharray="5 4" stroke-width="1.4"/>
<text x="300.0" y="148.0" font-size="16" fill="#d7dae0" text-anchor="middle" font-weight="700">Harness</text>
<text x="300.0" y="167.0" font-size="11" fill="#7f8590" text-anchor="middle">keeps the list, runs tools</text>
<rect x="548.0" y="120.0" width="180.0" height="64.0" rx="8" fill="#101114"/>
<text x="638.0" y="148.0" font-size="16" fill="#f2f3f5" text-anchor="middle" font-weight="700">Model</text>
<text x="638.0" y="167.0" font-size="11" fill="#7f8590" text-anchor="middle">writes the next message</text>
<line x1="88.0" y1="144.0" x2="196.0" y2="144.0" stroke="#3987e5" stroke-width="1.8" marker-end="url(#ahB)"/>
<text x="144.0" y="136.0" font-size="12" fill="#b9bdc6" text-anchor="middle">prompt</text>
<line x1="198.0" y1="162.0" x2="90.0" y2="162.0" stroke="#199e70" stroke-width="1.8" marker-end="url(#ahG)"/>
<text x="144.0" y="180.0" font-size="12" fill="#b9bdc6" text-anchor="middle">answer</text>
<path d="M390,118 C430,50 518,50 558,116" fill="none" stroke="#b9bdc6" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="474.0" y="52.0" font-size="12" fill="#b9bdc6" text-anchor="middle">the whole conversation, every call</text>
<line x1="546.0" y1="152.0" x2="404.0" y2="152.0" stroke="#199e70" stroke-width="1.8" marker-end="url(#ahG)"/>
<text x="474.0" y="145.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-weight="600">text only: done</text>
<path d="M558,186 C518,254 430,254 390,188" fill="none" stroke="#c98500" stroke-width="1.8" marker-end="url(#ahY)"/>
<text x="474.0" y="262.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-weight="600">tool call: the harness runs it,</text>
<text x="474.0" y="279.0" font-size="12" fill="#b9bdc6" text-anchor="middle">appends the result and calls again</text>
</g>
</svg>
