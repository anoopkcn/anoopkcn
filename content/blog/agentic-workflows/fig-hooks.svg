<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Hook events at fixed points in the agent loop">
<title>Hook events at fixed points in the agent loop</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9bdc6"/></marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#769dce"/></marker>
  <marker id="ahY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98500"/></marker>
  <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker>
  <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker>
</defs>
<rect width="760" height="200" rx="8" fill="#22252a"/>
<g font-family="ZedSans, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b9bdc6">
<line x1="30.0" y1="90.0" x2="730.0" y2="90.0" stroke="#3a3e46" stroke-width="1"/>
<rect x="30.0" y="76.0" width="138.0" height="28.0" rx="14" fill="#22252a" stroke="#7f8590"/>
<text x="99.0" y="95.0" font-size="12" fill="#d7dae0" text-anchor="middle">model picks a tool</text>
<rect x="188.4" y="76.0" width="104.0" height="28.0" rx="5" fill="#769dce"/>
<text x="240.4" y="95.0" font-size="12" fill="#101114" text-anchor="middle" font-weight="700">PreToolUse</text>
<text x="240.4" y="126.0" font-size="12" fill="#b9bdc6" text-anchor="middle">block</text>
<text x="240.4" y="142.0" font-size="12" fill="#b9bdc6" text-anchor="middle">dangerous commands</text>
<rect x="312.8" y="76.0" width="82.0" height="28.0" rx="14" fill="#22252a" stroke="#7f8590"/>
<text x="353.8" y="95.0" font-size="12" fill="#d7dae0" text-anchor="middle">tool runs</text>
<rect x="415.2" y="76.0" width="108.0" height="28.0" rx="5" fill="#769dce"/>
<text x="469.2" y="95.0" font-size="12" fill="#101114" text-anchor="middle" font-weight="700">PostToolUse</text>
<text x="469.2" y="126.0" font-size="12" fill="#b9bdc6" text-anchor="middle">auto-format</text>
<text x="469.2" y="142.0" font-size="12" fill="#b9bdc6" text-anchor="middle">edited files</text>
<rect x="543.6" y="76.0" width="106.0" height="28.0" rx="5" fill="#769dce"/>
<text x="596.6" y="95.0" font-size="12" fill="#101114" text-anchor="middle" font-weight="700">Notification</text>
<text x="596.6" y="126.0" font-size="12" fill="#b9bdc6" text-anchor="middle">alert when</text>
<text x="596.6" y="142.0" font-size="12" fill="#b9bdc6" text-anchor="middle">input is needed</text>
<rect x="670.0" y="76.0" width="60.0" height="28.0" rx="5" fill="#769dce"/>
<text x="700.0" y="95.0" font-size="12" fill="#101114" text-anchor="middle" font-weight="700">Stop</text>
<text x="700.0" y="126.0" font-size="12" fill="#b9bdc6" text-anchor="middle">check the task</text>
<text x="700.0" y="142.0" font-size="12" fill="#b9bdc6" text-anchor="middle">is really done</text>
<path d="M469.2,74 C429.2,20 139.0,20 99.0,74" fill="none" stroke="#7f8590" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="284.1" y="30.0" font-size="12" fill="#7f8590" text-anchor="middle">next iteration</text>
<rect x="30.0" y="172.0" width="12.0" height="12.0" rx="2" fill="#769dce"/>
<text x="48.0" y="183.0" font-size="12" fill="#b9bdc6">hook event: your shell command runs here, every time</text>
</g>
