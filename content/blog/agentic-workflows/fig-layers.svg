<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Four nested layers: model, context, loop, harness">
<title>Four nested layers: model, context, loop, harness</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9bdc6"/></marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#769dce"/></marker>
  <marker id="ahY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98500"/></marker>
  <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker>
  <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker>
</defs>
<rect width="760" height="340" rx="8" fill="#22252a"/>
<g font-family="ZedSans, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b9bdc6">
<circle cx="190" cy="170" r="150" fill="none" stroke="#7f8590" stroke-width="1"/>
<text x="190.0" y="38.0" font-size="10" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">HARNESS</text>
<circle cx="190" cy="170" r="115" fill="none" stroke="#7f8590" stroke-width="1"/>
<text x="190.0" y="73.0" font-size="10" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">LOOP</text>
<circle cx="190" cy="170" r="80" fill="none" stroke="#7f8590" stroke-width="1"/>
<text x="190.0" y="108.0" font-size="10" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">CONTEXT</text>
<circle cx="190" cy="170" r="42" fill="#769dce"/>
<text x="190.0" y="174.0" font-size="11" fill="#1b1d22" text-anchor="middle" font-weight="700" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">MODEL</text>
<text x="390.0" y="80.0" font-size="16" fill="#d7dae0" font-weight="600">1  The model</text>
<text x="390.0" y="101.0" font-size="13" fill="#b9bdc6">How is the next token chosen?</text>
<line x1="390.0" y1="116.0" x2="720.0" y2="116.0" stroke="#3a3e46" stroke-width="1"/>
<text x="390.0" y="142.0" font-size="16" fill="#d7dae0" font-weight="600">2  The context</text>
<text x="390.0" y="163.0" font-size="13" fill="#b9bdc6">What does the model see?</text>
<line x1="390.0" y1="178.0" x2="720.0" y2="178.0" stroke="#3a3e46" stroke-width="1"/>
<text x="390.0" y="204.0" font-size="16" fill="#d7dae0" font-weight="600">3  The loop</text>
<text x="390.0" y="225.0" font-size="13" fill="#b9bdc6">How does a model take action?</text>
<line x1="390.0" y1="240.0" x2="720.0" y2="240.0" stroke="#3a3e46" stroke-width="1"/>
<text x="390.0" y="266.0" font-size="16" fill="#d7dae0" font-weight="600">4  The harness</text>
<text x="390.0" y="287.0" font-size="13" fill="#b9bdc6">Where do you have leverage?</text>
<line x1="390.0" y1="302.0" x2="720.0" y2="302.0" stroke="#3a3e46" stroke-width="1"/>
</g>
</svg>
