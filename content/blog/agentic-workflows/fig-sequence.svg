<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" role="img" aria-label="One turn of a coding agent, step by step">
<title>One turn of a coding agent, step by step</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9bdc6"/></marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#769dce"/></marker>
  <marker id="ahY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98500"/></marker>
  <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker>
  <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker>
</defs>
<rect width="760" height="486" rx="8" fill="#22252a"/>
<g font-family="ZedSans, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b9bdc6">
<rect x="30.0" y="20.0" width="120.0" height="34.0" rx="6" fill="#2c3036" stroke="#7f8590"/>
<text x="90.0" y="42.0" font-size="14" fill="#d7dae0" text-anchor="middle" font-weight="600">You</text>
<line x1="90.0" y1="54.0" x2="90.0" y2="470.0" stroke="#3a3e46" stroke-width="1"/>
<rect x="210.0" y="20.0" width="120.0" height="34.0" rx="6" fill="#2c3036" stroke="#7f8590"/>
<text x="270.0" y="42.0" font-size="14" fill="#d7dae0" text-anchor="middle" font-weight="600">Harness</text>
<line x1="270.0" y1="54.0" x2="270.0" y2="470.0" stroke="#3a3e46" stroke-width="1"/>
<rect x="410.0" y="20.0" width="120.0" height="34.0" rx="6" fill="#2c3036" stroke="#7f8590"/>
<text x="470.0" y="42.0" font-size="14" fill="#d7dae0" text-anchor="middle" font-weight="600">Model</text>
<line x1="470.0" y1="54.0" x2="470.0" y2="470.0" stroke="#3a3e46" stroke-width="1"/>
<rect x="600.0" y="20.0" width="120.0" height="34.0" rx="6" fill="#2c3036" stroke="#7f8590"/>
<text x="660.0" y="42.0" font-size="14" fill="#d7dae0" text-anchor="middle" font-weight="600">Shell / files</text>
<line x1="660.0" y1="54.0" x2="660.0" y2="470.0" stroke="#3a3e46" stroke-width="1"/>
<rect x="200.0" y="104.0" width="540.0" height="262.0" rx="8" fill="none" stroke="#769dce" stroke-dasharray="5 4"/>
<text x="730.0" y="122.0" font-size="10" fill="#769dce" text-anchor="end" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">AGENT LOOP</text>
<line x1="92.0" y1="86.0" x2="266.0" y2="86.0" stroke="#3987e5" stroke-width="1.6" marker-end="url(#ahB)"/>
<text x="180.0" y="79.0" font-size="12" fill="#d7dae0" text-anchor="middle">“fix the failing test”</text>
<line x1="272.0" y1="140.0" x2="466.0" y2="140.0" stroke="#b9bdc6" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370.0" y="133.0" font-size="12" fill="#d7dae0" text-anchor="middle">system + tools + history</text>
<line x1="468.0" y1="176.0" x2="274.0" y2="176.0" stroke="#c98500" stroke-width="1.6" marker-end="url(#ahY)"/>
<text x="370.0" y="169.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">tool_use: bash("pytest -x")</text>
<line x1="272.0" y1="212.0" x2="656.0" y2="212.0" stroke="#b9bdc6" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="465.0" y="205.0" font-size="12" fill="#d7dae0" text-anchor="middle">permission check, then run</text>
<line x1="658.0" y1="248.0" x2="274.0" y2="248.0" stroke="#c98500" stroke-width="1.6" marker-end="url(#ahY)"/>
<text x="465.0" y="241.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">stdout + exit code (truncated)</text>
<line x1="272.0" y1="284.0" x2="466.0" y2="284.0" stroke="#b9bdc6" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370.0" y="277.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">history + tool_result</text>
<line x1="468.0" y1="320.0" x2="274.0" y2="320.0" stroke="#c98500" stroke-width="1.6" marker-end="url(#ahY)"/>
<text x="370.0" y="313.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">tool_use: edit_file(…)</text>
<text x="370.0" y="386.0" font-size="12" fill="#7f8590" text-anchor="middle">… repeat until the model stops calling tools …</text>
<line x1="468.0" y1="414.0" x2="274.0" y2="414.0" stroke="#199e70" stroke-width="1.6" marker-end="url(#ahG)"/>
<text x="370.0" y="407.0" font-size="12" fill="#d7dae0" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">text, stop_reason = end_turn</text>
<line x1="268.0" y1="450.0" x2="94.0" y2="450.0" stroke="#199e70" stroke-width="1.6" marker-end="url(#ahG)"/>
<text x="180.0" y="443.0" font-size="12" fill="#d7dae0" text-anchor="middle">“Fixed: the fixture was …”</text>
</g>
</svg>
