<line x1="30.0" y1="240.0" x2="720.0" y2="240.0" stroke="#3a3e46" stroke-width="1"/>
<text x="30.0" y="258.0" font-size="12" fill="#7f8590">Illustrative splits; ␣ marks a space. Each model family has its own tokenizer.</text>
