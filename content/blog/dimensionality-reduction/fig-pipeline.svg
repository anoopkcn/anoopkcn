<rect x="462.0" y="30.0" width="124.0" height="54.0" rx="6" fill="#2c3036" stroke="#3a3e46"/>
<text x="468.0" y="42.0" font-size="9" fill="#7f8590" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">4</text>
