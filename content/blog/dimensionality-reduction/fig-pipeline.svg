<line x1="442.0" y1="169.0" x2="459.0" y2="169.0" stroke="#b9bdc6" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="462.0" y="142.0" width="124.0" height="54.0" rx="6" fill="#2c3036" stroke="#3a3e46"/>
