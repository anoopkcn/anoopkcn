<rect x="608.0" y="142.0" width="124.0" height="54.0" rx="6" fill="#2c3036" stroke="#3a3e46"/>
<text x="614.0" y="154.0" font-size="9" fill="#7f8590" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">10</text>
