<text x="670.0" y="183.0" font-size="12" fill="#d7dae0" text-anchor="middle">data sets</text>
<path d="M670.0,84 L670.0,106 L86.0,106 L86.0,139" fill="none" stroke="#b9bdc6" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="670.0" y1="198.0" x2="670.0" y2="226.0" stroke="#b9bdc6" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="670.0" y="244.0" font-size="12" fill="#b9bdc6" text-anchor="middle">model building</text>
