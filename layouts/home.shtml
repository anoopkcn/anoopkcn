<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
  <div class="home-intro" :html="$page.content()"></div>
  <h2 class="post-list-heading">Posts</h2>
  <div class="post-list">
      <div :loop="$site.page('blog').subpages()">
          <div class="post-item">
              <a class="title" href="$loop.it.link()">
                <h3 :text="$loop.it.title"></h3>
              </a>
              <span class="date" :text="$loop.it.date.format('January 02, 2006')"></span>
              <div class="abstract" :if="$loop.it.custom.get?('abstract')">
                  <span :text="$if"></span>
              </div>
          </div>
      </div>
  </div>
</body>
