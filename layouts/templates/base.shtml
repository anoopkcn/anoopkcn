<!DOCTYPE html>
<html>
  <head id="head">
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1">
    <title :text="$site.title"></title>
    <link rel="icon" href="$site.asset('favicon.ico').link()" type="image/x-icon">
    <link rel="preload" href="$site.asset('fonts/zed/zed-sans-extended.woff2').link()" as="font" type="font/woff2" crossorigin>
    <link type="text/css" rel="stylesheet" href="$site.asset('fonts.css').link()">
    <link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
    <link type="text/css" rel="stylesheet" href="$site.asset('highlight.css').link()">
    <super>
  </head>
  <body>
    <aside class="pane pane-left">
      <div id="pane-left" class="pane-inner">
        <a class="myname" href="$site.page('').link()">Anoop K Chandran</a>
        <nav class="site-nav" aria-label="Site">
          <a href="$site.page('').link()" class="$site.page('').isCurrent().then('current')">Home</a>
          <a href="$site.page('blog').link()" class="$page.link().startsWith('/blog/').then('current')">Blog</a>
          <a href="$site.page('about').link()" class="$site.page('about').isCurrent().then('current')">About</a>
          <a href="https://github.com/anoopkcn" target="_blank">GitHub</a>
        </nav>
        <super>
        <footer class="pane-footer">© Anoop K Chandran</footer>
      </div>
    </aside>
    <main id="main">
      <super>
      <footer class="main-footer">© Anoop K Chandran</footer>
    </main>
    <aside class="pane pane-right">
      <div id="pane-right" class="pane-inner">
        <super>
      </div>
    </aside>
  </body>
</html>
